openapi: 3.1.0
info:
  title: Local Geomagnetic Data Application API
  version: 1.0.0
  description: >-
    Локальный API приложения на компьютере исследователя. Не является API
    INTERMAGNET. Точный адрес локального сервера и внешний контракт INTERMAGNET
    уточняются перед реализацией.
servers:
  - url: http://127.0.0.1:{port}
    description: Локальный интерфейс приложения; порт задаётся конфигурацией приложения.
    variables:
      port:
        default: "8080"
paths:
  /imports:
    post:
      summary: Запустить получение сырых данных INTERMAGNET
      description: Создаёт Job импорта; исходные данные сохраняются в локальной БД.
      operationId: createImport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '202':
          description: Job создан или возвращён ранее созданный Job для того же ключа и запроса.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Ключ идемпотентности уже использован с другими параметрами.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

  /processing:
    post:
      summary: Запустить обработку сырого набора
      description: Создаёт отдельный Job и сохраняет результат отдельно от исходного набора.
      operationId: createProcessing
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessingRequest'
      responses:
        '202':
          description: Job обработки создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Сырой набор не найден или метод обработки не поддерживается.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ключ идемпотентности уже использован с другими параметрами.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

  /jobs/{jobId}:
    get:
      summary: Получить состояние задания
      operationId: getJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Состояние Job и ссылка на созданный набор, если он готов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

  /datasets:
    get:
      summary: Найти сохранённые наборы
      description: Читает локальную БД и не обращается к INTERMAGNET.
      operationId: listDatasets
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [raw, processed]
        - name: observatoryId
          in: query
          required: false
          schema:
            type: string
        - name: sourceRawDatasetId
          in: query
          required: false
          description: Фильтр обработанных результатов по исходному набору.
          schema:
            type: string
        - name: start
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Страница локально сохранённых наборов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

  /datasets/{datasetId}:
    get:
      summary: Получить метаданные набора
      operationId: getDataset
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Метаданные и происхождение набора.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

  /datasets/{datasetId}/records:
    get:
      summary: Прочитать содержимое набора
      description: Возвращает локально сохранённые записи; сырая форма ответа источника сохраняется без научной обработки.
      operationId: getDatasetRecords
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 500
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Страница сохранённых записей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/StorageUnavailable'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Повтор с тем же ключом и телом возвращает прежний Job; другое тело даёт конфликт.
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Неверные параметры запроса.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Job или набор не найден.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StorageUnavailable:
      description: Локальная БД недоступна или не выполнила операцию.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ImportRequest:
      type: object
      additionalProperties: false
      required: [observatoryId, timeRange, components]
      properties:
        observatoryId:
          type: string
        timeRange:
          $ref: '#/components/schemas/TimeRange'
        components:
          type: array
          minItems: 1
          items:
            type: string
    ProcessingRequest:
      type: object
      additionalProperties: false
      required: [rawDatasetId, methodId]
      properties:
        rawDatasetId:
          type: string
        methodId:
          type: string
        parameters:
          type: object
          additionalProperties: true
          default: {}
    TimeRange:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
      description: start должен быть раньше end; часовой пояс обязателен.
    JobAccepted:
      type: object
      required: [jobId, status, statusUrl]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [Created]
        statusUrl:
          type: string
          format: uri-reference
    Job:
      type: object
      required: [jobId, kind, status, createdAt]
      properties:
        jobId:
          type: string
        kind:
          type: string
          enum: [import, processing]
        status:
          type: string
          enum: [Created, Downloading, Processing, Completed, Failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        datasetId:
          type: string
          description: Заполняется после успешного сохранения результата.
        error:
          $ref: '#/components/schemas/Error'
    DatasetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dataset'
        nextCursor:
          type: string
    Dataset:
      type: object
      required: [datasetId, kind, recordCount, createdAt, provenance]
      properties:
        datasetId:
          type: string
        kind:
          type: string
          enum: [raw, processed]
        observatoryId:
          type: string
        sourceRawDatasetId:
          type: string
        timeRange:
          $ref: '#/components/schemas/TimeRange'
        methodId:
          type: string
        parameters:
          type: object
          additionalProperties: true
        recordCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        provenance:
          type: object
          additionalProperties: true
    RecordPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Запись в форме, определённой подтверждённым форматом выбранного набора.
        nextCursor:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        correlationId:
          type: string
