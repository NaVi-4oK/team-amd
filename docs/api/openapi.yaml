openapi: 3.1.0
info:
  title: INTERMAGNET HAPI
  version: "3.1"
  description: >-
    OpenAPI description of the external INTERMAGNET HAPI service used by the
    import Tool. This is not an API exposed by the local application. Official
    endpoint: https://imag-data.bgs.ac.uk/GIN_V1/hapi. INTERMAGNET reports that
    this server supports HAPI 3.1.
  contact:
    name: INTERMAGNET Edinburgh GIN
    email: e_ginman@bgs.ac.uk
externalDocs:
  description: INTERMAGNET HAPI service documentation
  url: https://imag-data.bgs.ac.uk/GIN_V1/hapi
servers:
  - url: https://imag-data.bgs.ac.uk/GIN_V1/hapi
    description: INTERMAGNET HAPI service
paths:
  /capabilities:
    get:
      operationId: getCapabilities
      summary: List HAPI version and supported output formats
      responses:
        '200':
          description: HAPI capabilities response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '500':
          $ref: '#/components/responses/ServerError'

  /about:
    get:
      operationId: getAbout
      summary: Get information about the HAPI server
      responses:
        '200':
          description: Server identity and contact information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/About'
        '500':
          $ref: '#/components/responses/ServerError'

  /catalog:
    get:
      operationId: getCatalog
      summary: List available INTERMAGNET datasets
      responses:
        '200':
          description: Catalog of dataset IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '500':
          $ref: '#/components/responses/ServerError'

  /info:
    get:
      operationId: getDatasetInfo
      summary: Get metadata and parameters for a dataset
      parameters:
        - name: dataset
          in: query
          required: true
          description: Dataset ID returned by `/catalog`.
          schema:
            $ref: '#/components/schemas/DatasetId'
        - name: parameters
          in: query
          required: false
          description: Comma-separated subset of dataset parameters, in catalog order.
          schema:
            type: string
      responses:
        '200':
          description: Dataset metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /data:
    get:
      operationId: getData
      summary: Stream measurements for a dataset and time interval
      parameters:
        - name: dataset
          in: query
          required: true
          description: Dataset ID returned by `/catalog`.
          schema:
            $ref: '#/components/schemas/DatasetId'
        - name: start
          in: query
          required: true
          description: Inclusive start time in HAPI restricted ISO 8601 format.
          schema:
            type: string
            format: date-time
            example: "2025-01-01T00:00:00Z"
        - name: stop
          in: query
          required: true
          description: Exclusive stop time in HAPI restricted ISO 8601 format.
          schema:
            type: string
            format: date-time
            example: "2025-01-02T00:00:00Z"
        - name: parameters
          in: query
          required: false
          description: Comma-separated dataset parameter names; omit to request all parameters.
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: INTERMAGNET currently advertises csv, json and binary.
          schema:
            type: string
            enum: [csv, json, binary]
            default: csv
        - name: include
          in: query
          required: false
          description: Include HAPI metadata header with the data stream when supported.
          schema:
            type: string
            enum: [header]
      responses:
        '200':
          description: >-
            Data stream in the requested format. A successful request with no
            records for the interval is still HTTP 200; the HAPI status is
            1201 (preferred) or 1200 with an empty stream.
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
                description: HAPI JSON data stream; fields follow dataset metadata.
                additionalProperties: true
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    HapiStatus:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: Standard HAPI status code. A server may also use a documented extension code.
          examples: [1200, 1201, 1406, 1500]
        message:
          type: string
    Capabilities:
      type: object
      required: [HAPI, status, outputFormats]
      properties:
        HAPI:
          type: string
          example: "3.1"
        status:
          $ref: '#/components/schemas/HapiStatus'
        outputFormats:
          type: array
          items:
            type: string
            enum: [csv, json, binary]
          example: [csv, json, binary]
    About:
      type: object
      required: [HAPI, status, id, title, contact]
      properties:
        HAPI:
          type: string
        status:
          $ref: '#/components/schemas/HapiStatus'
        id:
          type: string
        title:
          type: string
        contact:
          type: string
        description:
          type: string
      additionalProperties: true
    Catalog:
      type: object
      required: [HAPI, status, catalog]
      properties:
        HAPI:
          type: string
        status:
          $ref: '#/components/schemas/HapiStatus'
        catalog:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id:
                $ref: '#/components/schemas/DatasetId'
              title:
                type: string
      additionalProperties: true
    DatasetId:
      type: string
      description: >-
        INTERMAGNET HAPI ID consists of IAGA observatory code, publication
        state, cadence and component orientation separated by slashes.
      pattern: '^[A-Za-z]{3}/(adjusted|definitive|quasi-def|reported|best-avail)/(PT1M|PT1S)/(xyzf|hdzf|diff|native)$'
      example: abk/definitive/PT1M/xyzf
    DatasetInfo:
      type: object
      required: [HAPI, status, parameters, startDate, stopDate]
      properties:
        HAPI:
          type: string
        status:
          $ref: '#/components/schemas/HapiStatus'
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/Parameter'
        startDate:
          type: string
        stopDate:
          type: string
        cadence:
          type: string
        description:
          type: string
        provenance:
          type: string
      additionalProperties: true
    Parameter:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [isotime, string, integer, double]
        units:
          type: string
        fill:
          oneOf:
            - type: string
            - type: number
        description:
          type: string
      additionalProperties: true
    HapiError:
      type: object
      required: [HAPI, status]
      properties:
        HAPI:
          type: string
        status:
          $ref: '#/components/schemas/HapiStatus'
      additionalProperties: true
  responses:
    BadRequest:
      description: HAPI input error; HAPI status code is normally 1400-series.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HapiError'
    NotFound:
      description: Dataset or parameter is unknown; HAPI status code is normally 1406 or 1407.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HapiError'
    ServerError:
      description: INTERMAGNET HAPI internal or upstream error; HAPI status code is normally 1500-series.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HapiError'
